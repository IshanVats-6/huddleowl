# Copies a finished build out of the private application repository and
# publishes it here, where the website's download buttons and this repository's
# README can reach it.
#
# WHY A WORKFLOW RATHER THAN A MANUAL UPLOAD. The installers are about 470 MB
# together. Doing this by hand means downloading all of it and uploading all of
# it again over a home connection. Here both hops happen inside GitHub's own
# network and the whole thing takes under a minute.
#
# ONE-TIME SETUP. This needs to read a private repository, which the automatic
# GITHUB_TOKEN cannot do, so it uses a token you create:
#
#   1. github.com/settings/personal-access-tokens/new
#   2. Repository access: Only select repositories, and pick IshanVats-6/huddleowl
#   3. Permissions: Contents, Read-only. Nothing else.
#   4. Save it in THIS repository under Settings, Secrets and variables,
#      Actions, as APP_REPO_TOKEN.
#
# Read-only on one repository is the whole grant. Publishing here uses the
# workflow's own token, which never leaves this repository.

name: Publish a build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v. For example 0.1.9"
        required: true
        type: string
      source_tag:
        description: "The release in the app repo to take the files from"
        required: true
        default: dev-latest
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
      SOURCE_REPO: IshanVats-6/huddleowl

    steps:
      - uses: actions/checkout@v4

      # Downloads live outside the checkout, so a half-finished run can never
      # leave 470 MB of installers staged for commit.
      #
      # This is a step rather than a job-level `env:` entry because the runner
      # context does not exist yet when job-level env is evaluated, and naming
      # it there fails the whole workflow before a single job starts.
      - name: Decide where the downloads land
        run: echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Fetch the installers from the app repo
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::APP_REPO_TOKEN is not set. See the setup notes at the top of this workflow."
            exit 1
          fi
          mkdir -p "$OUT"
          gh release download "${{ inputs.source_tag }}" \
            --repo "$SOURCE_REPO" \
            --dir "$OUT" \
            --pattern "HuddleOwl-$V-arm64.dmg" \
            --pattern "HuddleOwl-$V.dmg" \
            --pattern "HuddleOwl-$V-win-x64.exe"

      - name: Check all three arrived
        run: |
          set -euo pipefail
          missing=0
          for f in "HuddleOwl-$V-arm64.dmg" "HuddleOwl-$V.dmg" "HuddleOwl-$V-win-x64.exe"; do
            if [ ! -s "$OUT/$f" ]; then
              echo "::error::$f is missing or empty in $SOURCE_REPO at ${{ inputs.source_tag }}"
              missing=1
            fi
          done
          # A partial release is worse than none: the website and the README
          # would each offer three downloads and one of them would 404.
          exit $missing

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd "$OUT"
          sha256sum "HuddleOwl-$V-arm64.dmg" "HuddleOwl-$V.dmg" "HuddleOwl-$V-win-x64.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Measure the files
        id: sizes
        run: |
          set -euo pipefail
          {
            echo "arm=$(du -m "$OUT/HuddleOwl-$V-arm64.dmg" | cut -f1)"
            echo "intel=$(du -m "$OUT/HuddleOwl-$V.dmg" | cut -f1)"
            echo "win=$(du -m "$OUT/HuddleOwl-$V-win-x64.exe" | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          ARM: ${{ steps.sizes.outputs.arm }}
          INTEL: ${{ steps.sizes.outputs.intel }}
          WIN: ${{ steps.sizes.outputs.win }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          HuddleOwl $V, for macOS and Windows.

          Free for individuals. No account, no card, no sign up.

          | File | Platform | Size |
          |---|---|---|
          | \`HuddleOwl-$V-arm64.dmg\` | Apple Silicon Mac, macOS 11+ | $ARM MB |
          | \`HuddleOwl-$V.dmg\` | Intel Mac, macOS 11+ | $INTEL MB |
          | \`HuddleOwl-$V-win-x64.exe\` | Windows 10 and 11, x64 | $WIN MB |

          \`SHA256SUMS.txt\` covers all three. To check one:
          \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`

          **First launch on macOS.** HuddleOwl is not notarised with Apple yet, which is a
          signing formality rather than anything about the build. macOS will say the app is
          damaged. Run \`xattr -cr /Applications/HuddleOwl.app\` once, then open it again.

          **Windows.** The build is unsigned, so SmartScreen asks once. Choose More info,
          then Run anyway.

          **On-device models ship on macOS.** On Windows, HuddleOwl runs against a cloud
          model of your choosing while the local engines are being built.
          EOF
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V already exists, replacing its files"
            gh release upload "v$V" "$OUT"/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$V" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$V" "$OUT"/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "HuddleOwl $V" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$V"

      # The README's download buttons are versioned URLs, which is what makes a
      # click start the .dmg rather than open a page about it. The cost of that
      # is that they rot the moment a new build ships, so they are rewritten
      # here rather than left to be remembered.
      - name: Point the README at the new version
        env:
          ARM: ${{ steps.sizes.outputs.arm }}
        run: |
          set -euo pipefail
          sed -E -i \
            -e "s#/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/#/releases/download/v$V/#g" \
            -e "s#HuddleOwl-[0-9]+\.[0-9]+\.[0-9]+-arm64\.dmg#HuddleOwl-$V-arm64.dmg#g" \
            -e "s#HuddleOwl-[0-9]+\.[0-9]+\.[0-9]+-win-x64\.exe#HuddleOwl-$V-win-x64.exe#g" \
            -e "s#HuddleOwl-[0-9]+\.[0-9]+\.[0-9]+\.dmg#HuddleOwl-$V.dmg#g" \
            -e "s#Apple Silicon, [0-9]+ MB#Apple Silicon, $ARM MB#g" \
            README.md
          if git diff --quiet -- README.md; then
            echo "README was already pointing at $V"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point the downloads at $V" -- README.md
          git push

      - name: Confirm every advertised file exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/have.txt"
          cat "$RUNNER_TEMP/have.txt"
          for f in "HuddleOwl-$V-arm64.dmg" "HuddleOwl-$V.dmg" "HuddleOwl-$V-win-x64.exe" SHA256SUMS.txt; do
            grep -qx "$f" "$RUNNER_TEMP/have.txt" || { echo "::error::$f did not make it onto the release"; exit 1; }
          done
          echo "All four files are on v$V."
