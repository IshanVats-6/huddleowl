# The Sponsor button on this repository.
#
# GitHub renders the button from this file alone. There is no repository
# setting to flip, but the file has to be at .github/FUNDING.yml on the default
# branch or nothing appears.
#
# Both keys can be set at once, and the button then opens a menu.
#
#   custom     any URL, live the moment it merges. Nothing to enrol in.
#
#   github     needs an approved and PUBLISHED GitHub Sponsors profile. Being
#              accepted to the programme is not enough on its own: until tiers
#              are published the profile is not public, and a github: line
#              would put a dead link at the top of the page people arrive at to
#              download the app. Uncomment it once
#              github.com/sponsors/IshanVats-6 loads for a signed out visitor.
#              It is the one that carries recurring monthly sponsorship, which
#              is where open source funding actually comes from.

custom: ["https://huddleowl.com/support"]

# github: [IshanVats-6]
