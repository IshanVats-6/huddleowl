# The Sponsor button on this repository.
#
# GitHub renders the button from this file alone. There is no repository
# setting to flip, but the file has to be at .github/FUNDING.yml on the default
# branch or nothing appears. With both keys set the button opens a menu.
#
#   github     the recurring one. Monthly sponsorship, no platform fee on a
#              personal account, and it shows publicly on the profile. Card
#              only, billed in USD, and the payer needs a GitHub account.
#
#   custom     the support page, which carries a Razorpay button. It is here
#              because it is the only one of the two that takes UPI, and for an
#              Indian supporter that is one tap against typing card details for
#              a foreign currency charge.
#
# Both are live. Neither should be uncommented before its destination loads for
# a signed out visitor: a dead link at the top of the page people arrive at to
# download the app is worse than no button at all.

github: [IshanVats-6]
custom: ["https://huddleowl.com/support"]
