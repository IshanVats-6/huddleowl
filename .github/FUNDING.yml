# The Sponsor button on this repository.
#
# EVERY LINE IS COMMENTED OUT ON PURPOSE, and the file is here anyway. GitHub
# renders a Sponsor button the moment one of these is uncommented, and a button
# that leads nowhere is worse than no button: github.com/sponsors/IshanVats-6 is
# not an active sponsors profile yet, so a `github:` line today would put a link
# to a 404 at the top of the page people arrive at to download the app.
#
# TO TURN IT ON, uncomment one line.
#
#   github     needs enrolment at github.com/sponsors first: identity
#              verification, payout setup and tax forms, which takes days. It is
#              the one that supports recurring monthly sponsorship, which is
#              where open-source funding actually comes from.
#
#   custom     any URL, live immediately. A Razorpay page, Ko-fi, Polar, or a
#              pricing page. Nothing to enrol in and nothing to wait for.
#
# Both can be set at once, and the button opens a menu.

# github: [IshanVats-6]
# custom: ["https://huddleowl.com/pricing"]
